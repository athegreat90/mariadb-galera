version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(docker)"
    # Stay on the MariaDB LTS series (11.8). Major bumps (12.x are short-term
    # releases) are done deliberately, not by Dependabot.
    ignore:
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"