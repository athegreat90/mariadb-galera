name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      series:
        description: Comma-separated MariaDB series to build (empty = all in base-images.json)
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering ref)
        type: string
        required: false
        default: ''
      series:
        description: Comma-separated MariaDB series to build (empty = all in base-images.json)
        type: string
        required: false
        default: ''

# No default token permissions: every job below declares exactly what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Reads .github/base-images.json and fans out to series x arch.
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      series_list: ${{ steps.plan.outputs.series_list }}
      latest_lts: ${{ steps.plan.outputs.latest_lts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Plan series x arch matrix
        id: plan
        env:
          SERIES_FILTER: ${{ inputs.series }}
        run: |
          set -euo pipefail
          cfg=.github/base-images.json
          latest_lts="$(jq -r '.latest_lts' "$cfg")"
          jq -e --arg l "$latest_lts" '.series | has($l)' "$cfg" >/dev/null \
            || { echo "latest_lts '$latest_lts' is not a key of .series" >&2; exit 1; }

          matrix="$(jq -c --arg filter "$SERIES_FILTER" '
            ($filter | split(",") | map(gsub("\\s"; "")) | map(select(length > 0))) as $want
            | [ .series | to_entries[]
                | select(($want | length) == 0 or (.key as $k | $want | index($k)))
                | .key as $series | .value as $v
                | ( {platform: "linux/amd64", runner: "ubuntu-24.04",     arch: "amd64"},
                    {platform: "linux/arm64", runner: "ubuntu-24.04-arm", arch: "arm64"} )
                | . + {series: $series, base_ref: $v.ref, base_digest: $v.digest} ]
            | {include: .}' "$cfg")"
          series_list="$(jq -c '[.include[].series] | unique' <<< "$matrix")"
          [ "$series_list" != "[]" ] \
            || { echo "no series selected (filter: '$SERIES_FILTER')" >&2; exit 1; }

          {
            echo "matrix=$matrix"
            echo "series_list=$series_list"
            echo "latest_lts=$latest_lts"
          } >> "$GITHUB_OUTPUT"
          echo "Series: $series_list (latest LTS: $latest_lts)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: setup
    name: build (${{ matrix.series }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (per-arch labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Native build, loaded into the local daemon so the tests run on real
      # hardware for this architecture.
      - name: Build ${{ matrix.series }} ${{ matrix.platform }} for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: mariadb-galera:test
          cache-from: type=gha,scope=${{ matrix.series }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.series }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_ref }}@${{ matrix.base_digest }}
            BASE_IMAGE_REF=${{ matrix.base_ref }}
            BASE_IMAGE_DIGEST=${{ matrix.base_digest }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Detect MariaDB version
        id: version
        env:
          EXPECTED_SERIES: ${{ matrix.series }}
        run: |
          set -euo pipefail
          raw="$(docker run --rm --entrypoint mariadbd mariadb-galera:test --version)"
          full="$(sed -nE 's/.*Ver ([0-9]+\.[0-9]+\.[0-9]+)-MariaDB.*/\1/p' <<< "$raw")"
          [ -n "$full" ] || { echo "could not parse version from: $raw" >&2; exit 1; }
          series="${full%.*}"
          if [ "$series" != "$EXPECTED_SERIES" ]; then
            echo "series mismatch: image reports $full (series $series) but base-images.json entry is '$EXPECTED_SERIES'; the pinned ref/digest points at the wrong tag" >&2
            exit 1
          fi
          galera="$(docker run --rm --entrypoint dpkg-query mariadb-galera:test \
                      -W -f '${Version}' galera-4 2>/dev/null || echo unknown)"
          echo "full=$full"     >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "MariaDB $full (series $series, ${{ matrix.arch }}), galera-4 $galera" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test on ${{ matrix.arch }}
        run: ./test/smoke-test.sh mariadb-galera:test

      - name: Forced-SST 2-node test on ${{ matrix.arch }}
        run: ./test/sst-test.sh mariadb-galera:test

      - name: Outage-recovery test on ${{ matrix.arch }}
        run: ./test/resilience-test.sh mariadb-galera:test

      # Second call is a cache hit; it only re-exports and pushes.
      - name: Build and push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.series }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          outputs: >-
            type=image,
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},
            push-by-digest=true,
            name-canonical=true,
            push=true
          build-args: |
            BASE_IMAGE=${{ matrix.base_ref }}@${{ matrix.base_digest }}
            BASE_IMAGE_REF=${{ matrix.base_ref }}
            BASE_IMAGE_DIGEST=${{ matrix.base_digest }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.push.outputs.digest }}'
          # upload-artifact rejects ':' in filenames; store the bare hex and
          # re-add the sha256: prefix in the merge job.
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.series }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

      # Carries the resolved version to `merge` (matrix jobs can't share outputs).
      - name: Export version
        if: github.event_name != 'pull_request' && matrix.arch == 'amd64'
        run: |
          mkdir -p /tmp/version
          printf '%s' '${{ steps.version.outputs.full }}' > /tmp/version/version

      - name: Upload version
        if: github.event_name != 'pull_request' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: version-${{ matrix.series }}
          path: /tmp/version/version
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [setup, build]
    name: merge (${{ matrix.series }})
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
       || startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.setup.outputs.series_list) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.series }}-*
          merge-multiple: true

      - name: Download version
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/version
          name: version-${{ matrix.series }}

      - name: Read version
        id: ver
        run: echo "full=$(< /tmp/version/version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (index tags and annotations)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags are explicit; `latest`/`lts` follow only the newest LTS series.
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.series }}
            type=raw,value=${{ steps.ver.outputs.full }}
            type=raw,value=${{ steps.ver.outputs.full }}-{{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable=${{ matrix.series == needs.setup.outputs.latest_lts }}
            type=raw,value=lts,enable=${{ matrix.series == needs.setup.outputs.latest_lts }}
            type=raw,value=sha-${{ github.sha }}-${{ matrix.series }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.full }}

      - name: Create multi-arch manifest
        id: index
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          mapfile -t tag_args        < <(jq -r '.tags[]       | "-t\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotation_args < <(jq -r '.annotations[] | "--annotation\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t source_refs     < <(printf '%s\n' * | sed "s|^|${REGISTRY}/${IMAGE_NAME}@sha256:|")

          docker buildx imagetools create \
            "${tag_args[@]}" "${annotation_args[@]}" "${source_refs[@]}"

          ref="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$ref"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  publish-public:
    needs: merge
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
       || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - name: Ensure the package is public
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          pkg="${GITHUB_REPOSITORY##*/}"
          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            endpoint="/orgs/${OWNER}/packages/container/${pkg}"
          else
            endpoint="/user/packages/container/${pkg}"
          fi
          gh api --method PATCH "$endpoint" -f visibility=public
          echo "package ${pkg} set to public"
