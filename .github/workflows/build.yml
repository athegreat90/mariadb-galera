name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering ref)
        type: string
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      mariadb_version: ${{ steps.version.outputs.full }}
      mariadb_series: ${{ steps.version.outputs.series }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve pinned base image
        id: base
        run: |
          from_line="$(grep -m1 -E '^FROM ' Dockerfile | awk '{print $2}')"
          echo "ref=${from_line%@*}"    >> "$GITHUB_OUTPUT"
          echo "digest=${from_line#*@}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (per-arch labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Native build, loaded into the local daemon so the smoke test runs on
      # real hardware for this architecture.
      - name: Build ${{ matrix.platform }} for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: mariadb-galera:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          build-args: |
            BASE_IMAGE_REF=docker.io/library/${{ steps.base.outputs.ref }}
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Detect MariaDB version
        id: version
        run: |
          set -euo pipefail
          raw="$(docker run --rm --entrypoint mariadbd mariadb-galera:test --version)"
          full="$(sed -nE 's/.*Ver ([0-9]+\.[0-9]+\.[0-9]+)-MariaDB.*/\1/p' <<< "$raw")"
          [ -n "$full" ] || { echo "could not parse version from: $raw" >&2; exit 1; }
          galera="$(docker run --rm --entrypoint dpkg-query mariadb-galera:test \
                      -W -f '${Version}' galera-4 2>/dev/null || echo unknown)"
          echo "full=$full"        >> "$GITHUB_OUTPUT"
          echo "series=${full%.*}" >> "$GITHUB_OUTPUT"
          echo "MariaDB $full (series ${full%.*}), galera-4 $galera" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test on ${{ matrix.arch }}
        run: ./test/smoke-test.sh mariadb-galera:test

      # Second call is a cache hit; it only re-exports and pushes.
      - name: Build and push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          outputs: >-
            type=image,
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},
            push-by-digest=true,
            name-canonical=true,
            push=true
          build-args: |
            BASE_IMAGE_REF=docker.io/library/${{ steps.base.outputs.ref }}
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.push.outputs.digest }}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
       || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (index tags and annotations)
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.build.outputs.mariadb_series }}
            type=raw,value=${{ needs.build.outputs.mariadb_version }}
            type=raw,value=${{ needs.build.outputs.mariadb_version }}-{{date 'YYYYMMDD-HHmmss'}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ needs.build.outputs.mariadb_version }}

      - name: Create multi-arch manifest
        id: index
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          mapfile -t tag_args        < <(jq -r '.tags[]       | "-t\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotation_args < <(jq -r '.annotations[] | "--annotation\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t source_refs     < <(printf '%s\n' * | sed "s|^|${REGISTRY}/${IMAGE_NAME}@|")

          docker buildx imagetools create \
            "${tag_args[@]}" "${annotation_args[@]}" "${source_refs[@]}"

          ref="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$ref"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  publish-public:
    needs: merge
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
       || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - name: Ensure the package is public
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          pkg="${GITHUB_REPOSITORY##*/}"
          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            endpoint="/orgs/${OWNER}/packages/container/${pkg}"
          else
            endpoint="/user/packages/container/${pkg}"
          fi
          gh api --method PATCH "$endpoint" -f visibility=public
          echo "package ${pkg} set to public"