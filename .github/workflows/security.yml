name: security

# Lint, secret scan and image vulnerability scan. Runs on every PR and push to main,
# and weekly so newly published CVEs against the pinned base images show up without
# a code change. Nothing here publishes anything or needs a secret.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# No default token permissions: every job below declares exactly what it needs.
permissions: {}

env:
  # Scanner images are pinned by digest (versions in the comments). Bump them by hand.
  HADOLINT: hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d          # 2.15.1
  ACTIONLINT: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667         # 1.7.12
  GITLEAKS: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f  # v8.30.1
  TRIVY: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969                 # 0.74.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck rootfs/usr/local/bin/*.sh rootfs/usr/local/bin/gosu test/*.sh

      - name: hadolint
        run: docker run --rm -i "$HADOLINT" hadolint --failure-threshold warning - < Dockerfile

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT"

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS" detect --source /repo --no-banner --redact --verbose

  series:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      series: ${{ steps.list.outputs.series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: List series from base-images.json
        id: list
        run: echo "series=$(jq -c '.series | keys' .github/base-images.json)" >> "$GITHUB_OUTPUT"

  image-scan:
    needs: series
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.series.outputs.series) }}
    env:
      # Try the GHCR mirror of the vulnerability DB first, then the ECR one, so a
      # rate limit on one does not fail the scan.
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
      TRIVY_SKIP_JAVA_DB_UPDATE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build ${{ matrix.series }} image
        env:
          SERIES: ${{ matrix.series }}
        run: |
          set -euo pipefail
          ref="$(jq -r --arg s "$SERIES" '.series[$s] | .ref + "@" + .digest' .github/base-images.json)"
          docker build --build-arg "BASE_IMAGE=${ref}" -t "scan:${SERIES}" .
          docker save "scan:${SERIES}" -o "${RUNNER_TEMP}/scan.tar"

      # Fails the job on any CRITICAL vulnerability that already has a fix.
      - name: Trivy - fixable CRITICAL (fails)
        run: |
          docker run --rm -v trivy-cache:/root/.cache -v "${RUNNER_TEMP}:/scan" \
            -e TRIVY_DB_REPOSITORY -e TRIVY_SKIP_JAVA_DB_UPDATE "$TRIVY" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --input /scan/scan.tar

      # Reported for visibility; base-image drift should not turn main red for HIGH.
      - name: Trivy - fixable HIGH (report only)
        run: |
          docker run --rm -v trivy-cache:/root/.cache -v "${RUNNER_TEMP}:/scan" \
            -e TRIVY_DB_REPOSITORY -e TRIVY_SKIP_JAVA_DB_UPDATE "$TRIVY" \
            image --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0 --input /scan/scan.tar
