name: base-image-watch

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      changed_series: ${{ steps.compare.outputs.changed_series }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Optional but recommended: avoids anonymous Docker Hub pull limits.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compares every series pinned in .github/base-images.json with upstream and
      # rewrites the JSON in place for the ones that moved.
      - name: Compare pinned digests with upstream
        id: compare
        run: |
          set -euo pipefail
          cfg=.github/base-images.json
          changed=()
          while read -r series; do
            ref="$(jq -r --arg s "$series" '.series[$s].ref'    "$cfg")"
            pinned="$(jq -r --arg s "$series" '.series[$s].digest' "$cfg")"
            latest="$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')"
            if [ "$pinned" = "$latest" ]; then
              echo "Up to date: $series ($ref@$pinned)"
              continue
            fi
            echo "Base image moved: $series $pinned -> $latest"
            tmp="$(mktemp)"
            jq --arg s "$series" --arg d "$latest" '.series[$s].digest = $d' "$cfg" > "$tmp"
            mv "$tmp" "$cfg"
            changed+=("$series")
          done < <(jq -r '.series | keys[]' "$cfg")

          if [ "${#changed[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            list="$(IFS=,; echo "${changed[*]}")"
            echo "changed=true"            >> "$GITHUB_OUTPUT"
            echo "changed_series=$list"    >> "$GITHUB_OUTPUT"
          fi

      - name: Commit bumped digests
        id: commit
        if: steps.compare.outputs.changed == 'true'
        env:
          CHANGED_SERIES: ${{ steps.compare.outputs.changed_series }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: bump MariaDB base image digest(s) [${CHANGED_SERIES}]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.sha }}
      series: ${{ needs.check.outputs.changed_series }}
    secrets: inherit
